name: Build HK1 Box ImmortalWrt + OAF

on:
  workflow_dispatch:
    inputs:
      zh_default:
        description: '默认 LuCI 语言设为中文(zh_cn)。false=英文默认，true=中文默认（两种都内置中文语言包，可随时切换）'
        type: boolean
        default: true
        required: true
      immortalwrt_branch:
        description: 'ImmortalWrt 源码分支（23.05 = 内核 5.15，对 OAF 内核模块适配最好）'
        default: 'openwrt-23.05'
        required: true
      kernel:
        description: '封装用的 Flippy 内核系列（需与 rootfs 的 5.15.x 同系列，否则 oaf.ko 可能无法加载）'
        default: '5.15.y'
        required: true
      rootfs_run_id:
        description: '【可选】复用某次已编译好的 rootfs，只重跑封装步骤（填 run id，留空=完整编译）'
        default: ''
        required: false

permissions:
  contents: read
  actions: read

jobs:
  # ── 第一步：编译 ImmortalWrt armsr/armv8 rootfs（含 OAF + Docker + 常用包）──
  build-rootfs:
    if: ${{ github.event.inputs.rootfs_run_id == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget python3 libfuse-dev patch upx-ucl libelf-dev

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.immortalwrt_branch || 'openwrt-23.05' }}" https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: DIY part1 —— 加入 OAF(OpenAppFilter) 特征库 feed
        run: |
          chmod +x diy-part1.sh
          cd openwrt
          ../diy-part1.sh

      # ⚠️ 关键修复：之前漏掉下面两步，导致 luci / OAF / 中文包 都没被加入编译树，
      #    default-settings 找不到 luci 依赖而直接报错。必须先 update 再 install。
      - name: 更新软件源 feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装软件源 feeds
        run: cd openwrt && ./scripts/feeds install -a

      # ⚠️ 关键修复：OAF 三个坑，一步到位（脚本放在仓库里，避免 YAML heredoc 缩进问题）
      #   1) appfilter 同名包遮蔽：IMM packages 源的 open-app-filter 与 wshcxl/Open-App 的
      #      open-app-filter 都定义 appfilter。feeds install -a 按包名去重且 packages 在前，
      #      导致 Open-App 的 appfilter 没被链接进来 -> opkg "cannot find dependency appfilter"。
      #      修法：删 IMM 的链接 + 手动把 Open-App 的 open-app-filter 链接进编译树。
      #   2) oaf(kmod) 缺 Build/Prepare：补上，否则 oaf.ko 编不出来。
      - name: 修复 OAF 安装冲突与 kmod 编译
        run: |
          chmod +x fix-oaf.sh
          ./fix-oaf.sh

      - name: 写入 .config 并展开（含 IP / 语言定制）
        env:
          ZH_DEFAULT: ${{ github.event.inputs.zh_default == 'true' && '1' || '' }}
        run: |
          cp .config openwrt/.config
          cd openwrt
          echo "ZH_DEFAULT=[$ZH_DEFAULT]"
          ../diy-part2.sh
          make defconfig

      - name: 下载依赖包
        run: cd openwrt && make download -j$(nproc)

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 提取 rootfs 产物
        run: |
          cd openwrt
          mkdir -p ../artifact
          cp bin/targets/armsr/armv8/*.tar.gz ../artifact/ 2>/dev/null || true
          ls -lh ../artifact

      - name: 上传 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rootfs
          path: artifact/*.tar.gz
          if-no-files-found: error

  # ── 第二步：用 ophub 封装成 HK1 Box 启动镜像 ──
  package:
    needs: build-rootfs
    if: ${{ always() && (needs.build-rootfs.result == 'success' || needs.build-rootfs.result == 'skipped') }}
    # ⚠️ 必须用 ubuntu-24.04：ophub 的 remake 脚本里用了 cp --update=none，
    #    该选项要求 coreutils >= 9.3；ubuntu-22.04 只有 8.32，会直接报
    #    "cp: option '--update' doesn't allow an argument" 并中断封装。
    #    ophub 官方 CI 打包 OpenWrt 用的就是 ubuntu-24.04。
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载 rootfs 产物（本次编译）
        if: ${{ github.event.inputs.rootfs_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: immortalwrt-rootfs
          path: artifact

      - name: 下载 rootfs 产物（复用历史运行）
        if: ${{ github.event.inputs.rootfs_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RID="${{ github.event.inputs.rootfs_run_id }}"
          mkdir -p artifact
          echo "复用 run $RID 的 rootfs 产物"
          gh run download "$RID" -n immortalwrt-rootfs -D artifact --repo "${{ github.repository }}"
          ls -lh artifact

      - name: 兼容补丁：ophub 脚本中的 cp --update=none
        run: |
          echo "本机 coreutils: $(cp --version | head -n1)"
          AP="$(dirname "$GITHUB_WORKSPACE")/_actions/ophub/amlogic-s9xxx-openwrt/main"
          if [ -f "$AP/remake" ]; then
            echo "找到 $AP/remake，含 --update=none 行数: $(grep -c -- '--update=none' "$AP/remake" || true)"
            sed -i 's/--update=none/-n/g' "$AP/remake" \
              && echo "已把 --update=none 降级为等价的 -n（老 coreutils 也能跑）" \
              || echo "补丁未应用（不影响，24.04 自带 coreutils 9.4）"
          else
            echo "未找到 $AP/remake，跳过补丁（24.04 自带 coreutils 9.4，本身就能跑）"
          fi

      - name: 用 ophub 封装成 HK1 Box 启动镜像
        id: package
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: artifact/*.tar.gz
          openwrt_board: s905x3-hk1
          openwrt_kernel: ${{ github.event.inputs.kernel || '5.15.y' }}
          openwrt_ip: 192.168.50.101
          openwrt_size: 2048

      - name: 上传最终固件
        uses: actions/upload-artifact@v4
        with:
          name: hk1box-immortalwrt-oaf
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          if-no-files-found: error

      - name: 输出固件信息
        run: |
          echo "固件产物目录: ${{ env.PACKAGED_OUTPUTPATH }}"
          ls -lh ${{ env.PACKAGED_OUTPUTPATH }}
