name: Build HK1 Box ImmortalWrt + OAF

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      immortalwrt_branch:
        description: 'ImmortalWrt 源码分支'
        default: 'openwrt-24.10'
        required: true
      kernel:
        description: '封装用的 Flippy 内核版本（需与 rootfs 的 6.6.x 对应，否则 OAF 内核模块可能无法加载）'
        default: '6.6'
        required: true

jobs:
  # ── 第一步：编译 ImmortalWrt armsr/armv8 rootfs（含 OAF + Docker + 常用包）──
  build-rootfs:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget python3 libfuse-dev patch upx-ucl libelf-dev

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.immortalwrt_branch || 'openwrt-24.10' }}" https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: DIY part1 —— 加入 OAF(OpenAppFilter) 特征库 feed
        run: |
          chmod +x diy-part1.sh
          cd openwrt
          ../diy-part1.sh

      - name: 写入 .config 并展开
        run: |
          cp .config openwrt/.config
          cd openwrt
          make defconfig

      - name: 下载依赖包
        run: cd openwrt && make download -j$(nproc)

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 提取 rootfs 产物
        run: |
          cd openwrt
          mkdir -p ../artifact
          cp bin/targets/armsr/armv8/*.tar.gz ../artifact/ 2>/dev/null || true
          ls -lh ../artifact

      - name: 上传 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rootfs
          path: artifact/*.tar.gz

  # ── 第二步：用 ophub 脚本封装成 HK1 Box 启动镜像 ──
  package:
    needs: build-rootfs
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载 rootfs 产物
        uses: actions/download-artifact@v4
        with:
          name: immortalwrt-rootfs
          path: artifact

      - name: 安装封装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools e2fsprogs parted tar xz-utils bzip2 gzip coreutils mtools pv uuid-runtime

      - name: 克隆 ophub 封装脚本
        run: |
          git clone --depth 1 https://github.com/ophub/amlogic-s9xxx-openwrt.git amlogic

      - name: 放置 rootfs 供 ophub 使用
        run: |
          cd amlogic
          mkdir -p openwrt-armvirt
          cp ../artifact/*.tar.gz openwrt-armvirt/openwrt-armvirt-64-default-rootfs.tar.gz
          ls -lh openwrt-armvirt

      - name: 封装 HK1 Box 镜像
        run: |
          cd amlogic
          sudo chmod +x make
          sudo ./make -d -b hk1 -k "${{ github.event.inputs.kernel || '6.6' }}"

      - name: 上传最终固件
        uses: actions/upload-artifact@v4
        with:
          name: hk1box-immortalwrt-oaf
          path: amlogic/out/*.img*
