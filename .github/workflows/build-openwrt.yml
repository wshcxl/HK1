name: Build HK1 Box ImmortalWrt + OAF

on:
  workflow_dispatch:
    inputs:
      zh_default:
        description: '默认 LuCI 语言设为中文(zh_cn)。false=英文默认，true=中文默认（两种都内置中文语言包，可随时切换）'
        type: boolean
        default: true
        required: true
      immortalwrt_branch:
        description: 'ImmortalWrt 源码分支（23.05 = 内核 5.15，对 OAF 内核模块适配最好）'
        default: 'openwrt-23.05'
        required: true
      kernel:
        description: '【锁定】ophub 内核具体版本（要和 oaf.ko 编译对齐，不要随便改）'
        default: '5.15.222'
        required: true
      rootfs_run_id:
        description: '【可选】复用某次已编译好的 rootfs，只重跑封装步骤（填 run id，留空=完整编译）'
        default: ''
        required: false

permissions:
  contents: read
  actions: read

jobs:
  # ── 第一步：编译 ImmortalWrt armsr/armv8 rootfs（含 OAF + Docker + 常用包）──
  build-rootfs:
    if: ${{ github.event.inputs.rootfs_run_id == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget python3 libfuse-dev patch upx-ucl libelf-dev

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.immortalwrt_branch || 'openwrt-23.05' }}" https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: DIY part1 —— 加入 OAF(OpenAppFilter) 特征库 feed
        run: |
          chmod +x diy-part1.sh
          cd openwrt
          ../diy-part1.sh

      # ⚠️ 关键修复：之前漏掉下面两步，导致 luci / OAF / 中文包 都没被加入编译树，
      #    default-settings 找不到 luci 依赖而直接报错。必须先 update 再 install。
      - name: 更新软件源 feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: 安装软件源 feeds
        run: cd openwrt && ./scripts/feeds install -a

      # ⚠️ 关键修复：OAF 三个坑，一步到位（脚本放在仓库里，避免 YAML heredoc 缩进问题）
      #   1) appfilter 同名包遮蔽：IMM packages 源的 open-app-filter 与 wshcxl/Open-App 的
      #      open-app-filter 都定义 appfilter。feeds install -a 按包名去重且 packages 在前，
      #      导致 Open-App 的 appfilter 没被链接进来 -> opkg "cannot find dependency appfilter"。
      #      修法：删 IMM 的链接 + 手动把 Open-App 的 open-app-filter 链接进编译树。
      #   2) oaf(kmod) 缺 Build/Prepare：补上，否则 oaf.ko 编不出来。
      - name: 修复 OAF 安装冲突与 kmod 编译
        run: |
          chmod +x fix-oaf.sh
          ./fix-oaf.sh

      - name: 写入 .config 并展开（含 IP / 语言定制）
        env:
          ZH_DEFAULT: ${{ github.event.inputs.zh_default == 'true' && '1' || '' }}
        run: |
          cp .config openwrt/.config
          cd openwrt
          echo "ZH_DEFAULT=[$ZH_DEFAULT]"
          ../diy-part2.sh
          make defconfig

      - name: 下载依赖包
        run: cd openwrt && make download -j$(nproc)

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 提取 rootfs 产物
        run: |
          cd openwrt
          mkdir -p ../artifact
          cp bin/targets/armsr/armv8/*.tar.gz ../artifact/ 2>/dev/null || true
          ls -lh ../artifact

      - name: 上传 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rootfs
          path: artifact/*.tar.gz
          if-no-files-found: error

  # ── 第二步：用 ophub 封装成 HK1 Box 启动镜像 ──
  package:
    needs: build-rootfs
    if: ${{ always() && (needs.build-rootfs.result == 'success' || needs.build-rootfs.result == 'skipped') }}
    # ⚠️ 必须用 ubuntu-24.04：ophub 的 remake 脚本里用了 cp --update=none，
    #    该选项要求 coreutils >= 9.3；ubuntu-22.04 只有 8.32，会直接报
    #    "cp: option '--update' doesn't allow an argument" 并中断封装。
    #    ophub 官方 CI 打包 OpenWrt 用的就是 ubuntu-24.04。
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载 rootfs 产物（本次编译）
        if: ${{ github.event.inputs.rootfs_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: immortalwrt-rootfs
          path: artifact

      - name: 下载 rootfs 产物（复用历史运行）
        if: ${{ github.event.inputs.rootfs_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RID="${{ github.event.inputs.rootfs_run_id }}"
          mkdir -p artifact
          echo "复用 run $RID 的 rootfs 产物"
          gh run download "$RID" -n immortalwrt-rootfs -D artifact --repo "${{ github.repository }}"
          ls -lh artifact

      - name: 兼容补丁：ophub 脚本中的 cp --update=none
        run: |
          echo "本机 coreutils: $(cp --version | head -n1)"
          # composite action 被 GitHub 解到 /home/runner/work/_actions/<owner>/<repo>/<ref>
          AP="$(find /home/runner/work -maxdepth 4 -type d -name 'amlogic-s9xxx-openwrt' 2>/dev/null | head -n1)"
          if [ -n "$AP" ] && [ -f "$AP/remake" ]; then
            echo "找到 $AP/remake，含 --update=none 行数: $(grep -c -- '--update=none' "$AP/remake" || true)"
            sed -i 's/--update=none/-n/g' "$AP/remake" \
              && echo "已把 --update=none 降级为等价的 -n（老 coreutils 也能跑）" \
              || echo "补丁未应用（不影响，24.04 自带 coreutils 9.4）"
          else
            echo "未找到 ophub action 目录（AP=[$AP]），跳过补丁（24.04 自带 coreutils 9.4，本身就能跑）"
            ls -la /home/runner/work/_actions 2>/dev/null || true
          fi

      # ⚠️ 核心：ophub 封装会 rm -rf rootfs/lib/modules/* 再换成它自己的内核模块，
      #    我们编的 oaf.ko 会被丢掉，OAF 就等于废了。所以这里先"对着 ophub 内核重新编一份
      #    oaf.ko 并注入到它的内核模块包里"，详见 inject-oaf.sh 里的说明。
      - name: 安装交叉编译依赖（给 oaf.ko 用）
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make bc bison flex libelf-dev \
            libssl-dev kmod dwarves zstd dpkg-dev

      - name: 为 ophub 内核重编 oaf.ko 并注入内核模块包
        id: inject
        continue-on-error: true
        env:
          KVER: ${{ github.event.inputs.kernel || '5.15.222' }}
          KTAG: stable
        run: |
          chmod +x inject-oaf.sh
          # openwrt_files 输入要求这个目录必须先存在，否则 ophub 里 cp 会报 cannot stat
          mkdir -p oaf-files
          # composite action 被 GitHub 解到 /home/runner/work/_actions/<owner>/<repo>/<ref>
          ACT_DIR="$(find /home/runner/work -maxdepth 4 -type d -name 'amlogic-s9xxx-openwrt' 2>/dev/null | head -n1)"
          if [ -n "$ACT_DIR" ]; then
            export ACT_DIR
            echo "★ ophub action 目录：$ACT_DIR"
          else
            echo "⚠️ 没找到 ophub action 目录，交给 inject-oaf.sh 自己找"
            ls -la /home/runner/work/_actions 2>/dev/null || true
          fi
          ./inject-oaf.sh
          echo "OAF_INJECT=ok" >> "$GITHUB_ENV"

      - name: 注入失败提示
        if: ${{ steps.inject.outcome == 'failure' }}
        run: |
          echo "::error title=oaf.ko 注入失败::本次镜像不会包含 oaf.ko，OAF 应用识别/家长控制将无法工作。请看上一步日志。"

      - name: 用 ophub 封装成 HK1 Box 启动镜像
        id: package
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: artifact/*.tar.gz
          openwrt_board: s905x3-hk1
          openwrt_kernel: ${{ github.event.inputs.kernel || '5.15.222' }}
          # 锁死版本，避免 ophub 更新 latest 5.15.x 导致我们编的 oaf.ko vermagic 不匹配
          auto_kernel: 'false'
          # 注入的自定义 rootfs 文件（appfilter 启动脚本加 insmod 兜底）
          openwrt_files: oaf-files
          openwrt_ip: 192.168.1.96
          openwrt_size: 2048

      - name: 上传最终固件
        uses: actions/upload-artifact@v4
        with:
          name: hk1box-immortalwrt-oaf
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          if-no-files-found: error

      - name: 输出固件信息
        run: |
          echo "固件产物目录: ${{ env.PACKAGED_OUTPUTPATH }}"
          ls -lh ${{ env.PACKAGED_OUTPUTPATH }}

      - name: 验证镜像里确实有 oaf.ko
        # 这一步是"较真"用的：镜像里没有 oaf.ko 就直接把这次运行判红，
        # 免得打包成功但其实 OAF 是死的（上一版就踩了这个坑：只 glob *.img，实际产物是 .img.gz）
        run: |
          set +e
          OUT="${{ env.PACKAGED_OUTPUTPATH }}"
          echo "产物目录: $OUT"
          ls -lh "$OUT" || true
          IMG="$(ls "$OUT"/*.img 2>/dev/null | head -n1)"
          if [ -z "$IMG" ]; then
            GZ="$(ls "$OUT"/*.img.gz 2>/dev/null | head -n1)"
            if [ -n "$GZ" ]; then
              echo "镜像是压缩包，先解出来：$GZ"
              IMG=/tmp/hk1-verify.img
              gunzip -c "$GZ" > "$IMG"
            fi
          fi
          echo "镜像: [$IMG]"
          if [ -z "$IMG" ] || [ ! -s "$IMG" ]; then
            echo "::error title=验证失败::产物目录里既没有 .img 也没有 .img.gz"
            exit 1
          fi
          ls -lh "$IMG"

          echo "=== 粗筛：镜像里 oaf.ko 这个文件名出现次数 ==="
          # 注意：opkg 的包列表文件里也会出现 oaf.ko（路径指向 IMM 自己的内核版本），
          #      所以"oaf.ko 出现次数"只能当参考；
          #      真正说明注入成功的标记是 appfilter 启动脚本里那句 insmod 兜底
          #      （含有 kernel/oaf.ko 或 extra/oaf.ko 这样的真实路径），
          #      因为 modules-*.tar.gz 是压缩包，grep -a 扫不到里面的文件名。
          GREPN="$(grep -a -o 'oaf\.ko' "$IMG" | wc -l)"
          REAL="$(($(grep -a -o 'kernel/oaf\.ko' "$IMG" | wc -l) + $(grep -a -o 'extra/oaf\.ko' "$IMG" | wc -l)))"
          echo "oaf.ko 出现 $GREPN 次；其中真实路径标记（kernel/oaf.ko 或 extra/oaf.ko）出现 $REAL 次"

          FOUND=0
          MOUNTED=0
          sudo modprobe btrfs 2>/dev/null
          LOOP="$(sudo losetup -Pf --show "$IMG")"
          echo "loop 设备: $LOOP"
          sudo partx -s "$LOOP" 2>/dev/null
          sudo mkdir -p /mnt/hk1root
          for P in "${LOOP}p2" "${LOOP}p1"; do
            if sudo mount -o ro "$P" /mnt/hk1root 2>/dev/null; then
              MOUNTED=1
              echo "已挂载 $P"
              echo "=== /lib/modules ==="
              ls /mnt/hk1root/lib/modules/ || true
              echo "=== find -name 'oaf.ko*' ==="
              sudo find /mnt/hk1root/lib/modules -name 'oaf.ko*' -ls || true
              if sudo find /mnt/hk1root/lib/modules -name 'oaf.ko*' 2>/dev/null | grep -q .; then FOUND=1; fi
              echo "=== modules.dep 里的 oaf ==="
              sudo grep -h 'oaf' /mnt/hk1root/lib/modules/*/modules.dep || echo "⚠️ modules.dep 里没有 oaf"
              echo "=== /etc/init.d/appfilter ==="
              sudo ls -l /mnt/hk1root/etc/init.d/appfilter 2>/dev/null || echo "⚠️ 没有 /etc/init.d/appfilter"
              sudo grep -n 'oaf' /mnt/hk1root/etc/init.d/appfilter 2>/dev/null | head -n 20 || true
              if sudo grep -qE '(kernel|extra)/oaf\.ko' /mnt/hk1root/etc/init.d/appfilter 2>/dev/null; then
                echo "✅ appfilter 启动脚本已带 insmod 兜底（openwrt_files 注入生效）"
              else
                echo "::warning title=openwrt_files 可能没生效::/etc/init.d/appfilter 还是原版，modprobe 失败时没有 insmod 兜底"
              fi
              sudo umount /mnt/hk1root
              break
            fi
          done
          sudo losetup -d "$LOOP" 2>/dev/null

          if [ "$FOUND" = "1" ]; then
            echo "✅ 验证通过：镜像里确实有 oaf.ko"
            exit 0
          fi
          if [ "$MOUNTED" = "0" ] && [ "$REAL" -gt 0 ]; then
            echo "::warning title=无法挂载镜像::runner 挂不上 btrfs，不能逐文件确认；但镜像里出现了 kernel/oaf.ko 路径标记（$REAL 次），判定为已注入"
            exit 0
          fi
          echo "::error title=验证失败::镜像里找不到 oaf.ko —— 刷上去 OAF 不会有应用识别/家长控制"
          exit 1
