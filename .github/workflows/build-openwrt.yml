name: Build HK1 Box ImmortalWrt + OAF

on:
  workflow_dispatch:
    inputs:
      zh_default:
        description: '默认 LuCI 语言设为中文(zh_cn)。false=英文默认，true=中文默认（两种都内置中文语言包，可随时切换）'
        type: boolean
        default: true
        required: true
      immortalwrt_branch:
        description: 'ImmortalWrt 源码分支（23.05 = 内核 5.15，对 OAF 内核模块适配最好）'
        default: 'openwrt-23.05'
        required: true
      kernel:
        description: '封装用的 Flippy 内核系列（需与 rootfs 的 5.15.x 同系列，否则 oaf.ko 可能无法加载）'
        default: '5.15.y'
        required: true

jobs:
  # ── 第一步：编译 ImmortalWrt armsr/armv8 rootfs（含 OAF + Docker + 常用包）──
  build-rootfs:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache 2>/dev/null
          sudo apt-get clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget python3 libfuse-dev patch upx-ucl libelf-dev

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 -b "${{ github.event.inputs.immortalwrt_branch || 'openwrt-23.05' }}" https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: DIY part1 —— 加入 OAF(OpenAppFilter) 特征库 feed
        run: |
          chmod +x diy-part1.sh
          cd openwrt
          ../diy-part1.sh

      # ⚠️ 关键修复：之前漏掉下面两步，导致 luci / OAF / 中文包 都没被加入编译树，
      #    default-settings 找不到 luci 依赖而直接报错。必须先 update 再 install。
      - name: 更新软件源 feeds
        run: cd openwrt && ./scripts/feeds update -a

      # ⚠️ 关键修复 2（前置）：禁用 IMM 自带 open-app-filter，必须在 feeds install 之前做
      #   IMM packages 源的 net/open-app-filter 也提供 appfilter / kmod-oaf，与 wshcxl/Open-App 同名。
      #   若等 feeds install 之后再删 symlink，安装阶段会因"同名包被后者遮蔽"导致 Open-App 的
      #   appfilter 没被装进去 -> 最后 opkg 报 "cannot find dependency appfilter for luci-app-oaf"。
      #   做法：install 之前把 IMM 那个 Makefile 清空（目录保留，防止 feeds install 因缺目录报错），
      #   这样只有 Open-App 的 OAF 全套（kmod-oaf / appfilter / luci-app-oaf）生效。
      - name: 禁用 IMM 自带 open-app-filter（install 之前）
        run: |
          cd openwrt
          OAFP=feeds/packages/net/open-app-filter/Makefile
          if [ -f "$OAFP" ]; then
            mv "$OAFP" "${OAFP}.bak"
            printf '# disabled: 与 wshcxl/Open-App 的 OAF 重名冲突，已禁用 IMM 自带版本\n' > "$OAFP"
            echo "已禁用 IMM 自带 open-app-filter（避免遮蔽 Open-App 的 appfilter）"
          else
            echo "未找到 IMM open-app-filter，跳过"
          fi

      - name: 安装软件源 feeds
        run: cd openwrt && ./scripts/feeds install -a

      # ⚠️ 关键修复 3：Open-App 的 oaf(kmod) Makefile 缺少 Build/Prepare 把 src/* 拷到
      #   PKG_BUILD_DIR，导致 M=$(PKG_BUILD_DIR) 找不到 Kbuild，内核模块编不出来。这里补上。
      #   （上轮 kmod-oaf 已成功装上，说明此补丁有效；保留以防重装。）
      - name: 修复 OAF kmod 编译（Build/Prepare 补丁）
        run: |
          chmod +x fix-oaf.sh
          ./fix-oaf.sh

      - name: 写入 .config 并展开（含 IP / 语言定制）
        env:
          ZH_DEFAULT: ${{ github.event.inputs.zh_default == 'true' && '1' || '' }}
        run: |
          cp .config openwrt/.config
          cd openwrt
          echo "ZH_DEFAULT=[$ZH_DEFAULT]"
          ../diy-part2.sh
          make defconfig

      - name: 下载依赖包
        run: cd openwrt && make download -j$(nproc)

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 提取 rootfs 产物
        run: |
          cd openwrt
          mkdir -p ../artifact
          cp bin/targets/armsr/armv8/*.tar.gz ../artifact/ 2>/dev/null || true
          ls -lh ../artifact

      - name: 上传 rootfs
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-rootfs
          path: artifact/*.tar.gz
          if-no-files-found: error

  # ── 第二步：用 ophub 封装成 HK1 Box 启动镜像 ──
  package:
    needs: build-rootfs
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载 rootfs 产物
        uses: actions/download-artifact@v4
        with:
          name: immortalwrt-rootfs
          path: artifact

      - name: 用 ophub 封装成 HK1 Box 启动镜像
        id: package
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: artifact/*.tar.gz
          openwrt_board: s905x3-hk1
          openwrt_kernel: ${{ github.event.inputs.kernel || '5.15.y' }}
          openwrt_ip: 192.168.50.101
          openwrt_size: 2048

      - name: 上传最终固件
        uses: actions/upload-artifact@v4
        with:
          name: hk1box-immortalwrt-oaf
          path: ${{ env.PACKAGED_OUTPUTPATH }}/*.img*
          if-no-files-found: error

      - name: 输出固件信息
        run: |
          echo "固件产物目录: ${{ env.PACKAGED_OUTPUTPATH }}"
          ls -lh ${{ env.PACKAGED_OUTPUTPATH }}
