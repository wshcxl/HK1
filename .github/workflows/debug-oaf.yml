name: DEBUG OAF kconfig

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: 克隆 ImmortalWrt 源码
        run: |
          git clone --depth 1 -b openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git openwrt

      - name: DIY part1
        run: |
          chmod +x diy-part1.sh
          cd openwrt
          ../diy-part1.sh

      - name: feeds update + install
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: defconfig
        run: |
          cp .config openwrt/.config
          cd openwrt
          ../diy-part2.sh
          make defconfig || true

      - name: 打印 kmod-oaf 的 kconfig 块 + feed 内定义来源
        run: |
          cd openwrt
          echo "===== feed 内 kmod-oaf / KernelPackage/oaf 定义次数 ====="
          grep -rn "KernelPackage/oaf\|PKG_NAME:=oaf\|kernel module" package/feeds/oaf/ 2>/dev/null | head
          echo "===== 每个 config PACKAGE_kmod-oaf 块（含依赖/select）====="
          grep -n -A 14 "config PACKAGE_kmod-oaf" tmp/.config-package.in

